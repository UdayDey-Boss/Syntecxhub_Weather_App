<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline — Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="stage" id="stage" data-condition="clear">
    <div class="sky-glow"></div>

    <section class="card">
      <header class="card-header">
        <p class="wordmark">Skyline</p>
        <form id="searchForm" class="search" autocomplete="off">
          <input
            id="cityInput"
            type="text"
            placeholder="Search a city…"
            aria-label="City name"
            required
          />
          <button type="submit" aria-label="Search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </form>
      </header>

      <div id="statusArea" class="status" hidden></div>

      <div id="weatherArea" class="weather" hidden>
        <div class="place-line">
          <h1 id="cityName">—</h1>
          <p id="dateTime">—</p>
        </div>

        <div class="hero-row">
          <div class="temp-block">
            <span id="temperature">--</span>
            <span class="deg">°C</span>
          </div>
          <div class="icon-block">
            <img id="weatherIcon" src="" alt="" width="76" height="76" />
            <p id="description">—</p>
          </div>
        </div>

        <div class="detail-grid">
          <div class="detail">
            <span class="detail-label">Feels like</span>
            <span id="feelsLike" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span id="humidity" class="detail-value">—</span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind</span>
            <span id="wind" class="detail-value">—</span>
          </div>
        </div>
      </div>

      <footer class="card-footer">
        <span>Built for the Syntecxhub Internship — Front-End Track</span>
      </footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
